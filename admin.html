<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Управление каталогом — ЛИСТ</title><link rel="stylesheet" href="css/style.css"><script src="js/data.js" defer></script><script src="js/app.js" defer></script><script src="js/admin.js" defer></script></head><body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html">ЛИСТ<span>.</span></a><nav class="main-nav"><ul class="main-menu"><li class="menu-item"><a class="menu-link" href="catalog.html">Открыть каталог</a></li><li class="menu-item"><a class="menu-link" href="admin.html" aria-current="page">Кабинет администратора</a></li></ul></nav><div class="header-actions"><button class="contrast-toggle" data-contrast type="button">◐</button><a class="cart-link" href="index.html">На сайт</a><button class="link-button" type="button" data-admin-logout>Выйти</button></div></div></header><main class="container" data-admin><header class="page-head"><p class="eyebrow">Роль администратора</p><h1>Управление каталогом</h1><p>Новые карточки создаются средствами JavaScript и добавляются в DOM-дерево.</p></header><div class="admin-layout"><section class="admin-panel"><h2 data-form-title>Добавить книгу</h2><form id="book-form"><div class="field"><label for="title">Название</label><input id="title" name="title" required></div><div class="field"><label for="author">Автор</label><input id="author" name="author" required></div><div class="field"><label for="genre">Жанр</label><select id="genre" name="genre"><option>Современная проза</option><option>Роман</option><option>Рассказы</option><option>Наука</option><option>Поэзия</option><option>Саморазвитие</option><option>Фантастика</option><option>Психология</option><option>Классика</option></select></div><div class="field"><label for="age">Возраст</label><select id="age" name="age"><option>6+</option><option>12+</option><option>16+</option><option>18+</option></select></div><div class="field"><label for="price">Цена</label><input id="price" name="price" type="number" min="1" required></div><div class="field"><label for="color">Цвет обложки</label><input id="color" name="color" type="color" value="#58717a"></div><div class="field"><label for="badge">Метка</label><input id="badge" name="badge" placeholder="Новинка"></div><div class="field"><label for="description">Описание</label><textarea id="description" name="description" rows="4" required></textarea></div><button class="button" type="submit">Сохранить книгу</button></form></section><section class="admin-panel"><h2>Книги в каталоге</h2><div data-admin-books></div></section></div></main></body></html>
