<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оформление заказа — ЛИСТ</title><link rel="stylesheet" href="css/style.css"><script src="js/data.js" defer></script><script src="js/app.js" defer></script></head><body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html">ЛИСТ<span>.</span></a><nav class="main-nav"><ul class="main-menu"><li class="menu-item"><a class="menu-link" href="catalog.html">Каталог</a></li><li class="menu-item"><a class="menu-link" href="cart.html">Корзина</a></li></ul></nav><div class="header-actions"><button class="contrast-toggle" data-contrast type="button">◐</button><a data-user-link href="auth.html">Войти</a><a class="cart-link" href="cart.html">Корзина · <span data-cart-count>0</span></a></div></div></header><main class="container"><header class="page-head"><p class="eyebrow">Последний шаг</p><h1>Оформление заказа</h1></header><div class="forms-layout"><form class="form-card" data-checkout><div class="form-grid"><div class="field"><label for="name">Имя и фамилия</label><input id="name" name="name" required autocomplete="name"></div><div class="field"><label for="phone">Телефон</label><input id="phone" name="phone" type="tel" required autocomplete="tel" placeholder="+7 900 000-00-00"></div><div class="field span-2"><label for="email">Электронная почта</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field span-2"><label for="address">Адрес доставки</label><input id="address" name="address" required autocomplete="street-address"></div><div class="field"><label for="card">Номер учебной карты</label><input id="card" name="card" inputmode="numeric" pattern="[0-9 ]{16,19}" required placeholder="0000 0000 0000 0000"></div><div class="field"><label for="expiry">Срок действия</label><input id="expiry" name="expiry" pattern="[0-9]{2}/[0-9]{2}" required placeholder="12/30"></div><div class="field span-2"><label><input type="checkbox" required> Я подтверждаю учебный характер оплаты</label></div><button class="button span-2" type="submit">Оплатить <span data-order-total>0 ₽</span></button></div></form><aside class="summary"><h2>Оплата</h2><p>Данные карты используются только для демонстрации и никуда не передаются.</p><a href="cart.html">Вернуться в корзину</a></aside><section class="success span-2" data-order-success hidden><h2>Заказ оплачен</h2><p>Номер заказа: <strong data-order-number></strong></p><a class="button" href="profile.html">Посмотреть заказ</a></section></div></main></body></html>
